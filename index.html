<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading State Pattern Example</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }

    #content-container {
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      min-height: 100px;
    }

    .loading {
      color: #0066cc;
      font-weight: bold;
    }

    .empty {
      color: #777777;
      font-style: italic;
    }

    .data-item {
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }

    .data-item:last-child {
      border-bottom: none;
    }

    .controls {
      margin-bottom: 15px;
    }

    button {
      padding: 8px 12px;
      margin-right: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="controls">
    <button id="btn-load-data">Load Data</button>
    <button id="btn-load-empty">Load Empty State</button>
  </div>

  <div id="content-container"></div>

  <script>
    let isLoading = false;
    let items = [];

    function render() {
      const container = document.getElementById('content-container');

      // 1. Always check loading state first
      if (isLoading) {
        container.innerHTML = '<p class="loading">Loading, please wait...</p>';
        return;
      }

      // 2. Check for empty state only after loading is false
      if (items.length === 0) {
        container.innerHTML = '<p class="empty">Nothing here yet.</p>';
        return;
      }

      // 3. Render items when available
      let htmlOutput = '';
      for (let i = 0; i < items.length; i++) {
        htmlOutput += `<div class="data-item">${items[i].name}</div>`;
      }
      container.innerHTML = htmlOutput;
    }

    // Mock API call to simulate fetch delay
    function mockFetch(shouldReturnData) {
      return new Promise((resolve) => {
        setTimeout(() => {
          if (shouldReturnData) {
            resolve([
              { id: 1, name: 'First Record' },
              { id: 2, name: 'Second Record' },
              { id: 3, name: 'Third Record' }
            ]);
          } else {
            resolve([]);
          }
        }, 1500);
      });
    }

    async function loadDataHandler(shouldReturnData) {
      isLoading = true;
      items = [];
      render();

      try {
        const result = await mockFetch(shouldReturnData);
        items = result;
      } catch (error) {
        console.error('An error occurred during fetch:', error);
      } finally {
        isLoading = false;
        render();
      }
    }

    // Initialize initial render state
    render();

    // Event listeners
    document.getElementById('btn-load-data').addEventListener('click', () => {
      loadDataHandler(true);
    });

    document.getElementById('btn-load-empty').addEventListener('click', () => {
      loadDataHandler(false);
    });
  </script>
</body>
</html>
