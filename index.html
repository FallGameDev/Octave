<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Octave Music</title>
    <style>
        :root {
            --bg-base: #121212;
            --bg-surface: #181818;
            --bg-highlight: #282828;
            --text-main: #ffffff;
            --text-sub: #b3b3b3;
            --accent: #1db954;
            --border-radius: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Navigation Header */
        header {
            background-color: #000000;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent);
            margin-right: 10px;
        }

        /* Spotify-style Rounded Search Bar */
        .search-container {
            position: relative;
            flex: 1;
            max-width: 480px;
        }

        .search-bar {
            width: 100%;
            padding: 12px 20px 12px 42px;
            border-radius: 500px; /* Fully rounded pill style */
            border: 1px solid transparent;
            background-color: var(--bg-highlight);
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-bar:focus {
            border-color: #ffffff;
            background-color: #333333;
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            fill: var(--text-sub);
            width: 18px;
            height: 18px;
            pointer-events: none;
        }

        /* Main Container & Tabs */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 24px;
            overflow-y: auto;
        }

        .nav-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--bg-highlight);
            padding-bottom: 12px;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            font-weight: 600;
            font-size: 0.95rem;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            color: var(--text-main);
        }

        .tab-btn.active {
            background-color: var(--text-main);
            color: #000000;
        }

        /* Content Area */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Empty State Screen */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 50vh;
            color: var(--text-sub);
            text-align: center;
        }

        .empty-state h2 {
            color: var(--text-main);
            margin-bottom: 8px;
            font-size: 1.5rem;
        }

        /* Grid & Cards Layout */
        .section-title {
            font-size: 1.3rem;
            margin-bottom: 16px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .card {
            background-color: var(--bg-surface);
            padding: 16px;
            border-radius: var(--border-radius);
            transition: background-color 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .card:hover {
            background-color: var(--bg-highlight);
        }

        .card img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 12px;
            background-color: var(--bg-highlight);
        }

        .card-title {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-subtitle {
            font-size: 0.85rem;
            color: var(--text-sub);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge {
            display: inline-block;
            font-size: 0.7rem;
            text-transform: uppercase;
            padding: 2px 6px;
            border-radius: 4px;
            background-color: var(--accent);
            color: #000000;
            font-weight: 700;
            margin-top: 6px;
        }

        .badge-followed {
            background-color: #3d91ff;
            color: #ffffff;
        }

        .follow-btn {
            margin-top: 8px;
            width: 100%;
            padding: 6px 0;
            border-radius: 20px;
            border: 1px solid var(--text-sub);
            background: transparent;
            color: var(--text-main);
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 600;
        }

        .follow-btn.following {
            background-color: var(--text-main);
            color: #000000;
            border-color: var(--text-main);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Octave</div>
        <div class="search-container">
            <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="searchInput" class="search-bar" placeholder="What do you want to listen to?">
        </div>
    </header>

    <main>
        <!-- Navigation Tabs -->
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('home')">Home</button>
            <button class="tab-btn" onclick="switchTab('playlists')">Playlists</button>
            <button class="tab-btn" onclick="switchTab('albums')">Albums</button>
            <button class="tab-btn" onclick="switchTab('artists')">Artists</button>
        </div>

        <!-- HOME TAB -->
        <div id="tab-home" class="tab-content active">
            <div id="homeContent"></div>
        </div>

        <!-- PLAYLISTS TAB -->
        <div id="tab-playlists" class="tab-content">
            <h2 class="section-title">Your Playlists</h2>
            <div id="playlistsGrid" class="grid"></div>
        </div>

        <!-- ALBUMS TAB -->
        <div id="tab-albums" class="tab-content">
            <h2 class="section-title">Albums from Artists You Enjoy</h2>
            <div id="albumsGrid" class="grid"></div>
        </div>

        <!-- ARTISTS TAB -->
        <div id="tab-artists" class="tab-content">
            <h2 class="section-title">Followed Artists</h2>
            <div id="artistsGrid" class="grid"></div>
        </div>
    </main>

    <script>
        // Mock API State (with enjoy_artists endpoint structure)
        const mockApi = {
            songs: [
                { id: "s1", title: "Resonance", artist: "HOME", album: "Odyssey", plays: 0 },
                { id: "s2", title: "Native", artist: "HOME", album: "Odyssey", plays: 0 },
                { id: "s3", title: "Fallen Down", artist: "Toby Fox", album: "Undertale", plays: 0 },
                { id: "s4", title: "MEGALOVANIA", artist: "Toby Fox", album: "Undertale", plays: 0 },
                { id: "s5", title: "Midnight City", artist: "M83", album: "Hurry Up, We're Dreaming", plays: 0 },
                { id: "s6", title: "Wait", artist: "M83", album: "Hurry Up, We're Dreaming", plays: 0 }
            ],
            albums: [
                { id: "a1", title: "Odyssey", artist: "HOME" },
                { id: "a2", title: "Undertale", artist: "Toby Fox" },
                { id: "a3", title: "Hurry Up, We're Dreaming", artist: "M83" }
            ],
            playlists: [
                { id: "p1", title: "Lofi & Chill", trackCount: 12 },
                { id: "p2", title: "Coding Focus", trackCount: 24 }
            ],
            enjoy_artists: [], // Populated automatically when plays >= 2
            followed_artists: [] // Manually followed via artist profile
        };

        let currentQuery = "";

        // Core App Logic
        function init() {
            document.getElementById('searchInput').addEventListener('input', (e) => {
                currentQuery = e.target.value.trim().toLowerCase();
                renderHome();
            });
            renderHome();
            renderPlaylists();
            renderAlbums();
            renderArtists();
        }

        // Simulates listening to a song
        function playSong(songId) {
            const song = mockApi.songs.find(s => s.id === songId);
            if (!song) return;

            song.plays += 1;

            // Recalculate enjoyed artists (2 or more plays on their songs)
            updateEnjoyedArtists();
            
            // Rerender active views
            renderHome();
            renderAlbums();
        }

        function updateEnjoyedArtists() {
            const artistPlayCounts = {};
            
            mockApi.songs.forEach(song => {
                if (song.plays > 0) {
                    artistPlayCounts[song.artist] = (artistPlayCounts[song.artist] || 0) + song.plays;
                }
            });

            // "Enjoy" an artist once 2 plays are registered across their songs
            mockApi.enjoy_artists = Object.keys(artistPlayCounts).filter(artist => artistPlayCounts[artist] >= 2);
        }

        function toggleFollow(artistName) {
            const index = mockApi.followed_artists.indexOf(artistName);
            if (index > -1) {
                mockApi.followed_artists.splice(index, 1);
            } else {
                mockApi.followed_artists.push(artistName);
            }
            renderHome();
            renderArtists();
        }

        // Render Home View based on explicit ranking rules
        function renderHome() {
            const container = document.getElementById('homeContent');

            // 1. Empty State Handling
            if (!currentQuery) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h2>Search Something to Get Started.</h2>
                        <p>Find songs, albums, and artists across your favorite genres.</p>
                    </div>
                `;
                return;
            }

            // Search filtering across songs & albums
            let matchedSongs = mockApi.songs.filter(song => 
                song.title.toLowerCase().includes(currentQuery) || 
                song.artist.toLowerCase().includes(currentQuery) ||
                song.album.toLowerCase().includes(currentQuery)
            );

            if (matchedSongs.length === 0) {
                container.innerHTML = `<div class="empty-state"><h2>No results found for "${currentQuery}"</h2></div>`;
                return;
            }

            // Priority Scoring / Sorting Logic:
            // 1st Priority: Followed Artists
            // 2nd Priority: Enjoyed Artists (>= 2 plays)
            // 3rd Priority: Listened Artists (>= 1 play)
            // 4th Priority: Unheard / General Search Results
            matchedSongs.sort((a, b) => {
                const aFollowed = mockApi.followed_artists.includes(a.artist);
                const bFollowed = mockApi.followed_artists.includes(b.artist);
                if (aFollowed !== bFollowed) return bFollowed - aFollowed;

                const aEnjoyed = mockApi.enjoy_artists.includes(a.artist);
                const bEnjoyed = mockApi.enjoy_artists.includes(b.artist);
                if (aEnjoyed !== bEnjoyed) return bEnjoyed - aEnjoyed;

                const aListened = a.plays > 0;
                const bListened = b.plays > 0;
                if (aListened !== bListened) return bListened - aListened;

                return 0;
            });

            container.innerHTML = `
                <h2 class="section-title">Search Results</h2>
                <div class="grid">
                    ${matchedSongs.map(song => {
                        const isFollowed = mockApi.followed_artists.includes(song.artist);
                        const isEnjoyed = mockApi.enjoy_artists.includes(song.artist);
                        return `
                            <div class="card" onclick="playSong('${song.id}')">
                                <img src="https://via.placeholder.com/150/282828/FFFFFF?text=${encodeURIComponent(song.album)}" alt="Cover">
                                <div class="card-title">${song.title}</div>
                                <div class="card-subtitle">${song.artist} • ${song.album}</div>
                                ${isFollowed ? '<span class="badge badge-followed">Followed</span>' : ''}
                                ${!isFollowed && isEnjoyed ? '<span class="badge">Enjoyed</span>' : ''}
                                <div style="font-size: 0.75rem; color: var(--text-sub); margin-top: 6px;">Plays: ${song.plays}</div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        // Render Playlists
        function renderPlaylists() {
            const grid = document.getElementById('playlistsGrid');
            grid.innerHTML = mockApi.playlists.map(pl => `
                <div class="card">
                    <img src="https://via.placeholder.com/150/282828/FFFFFF?text=Playlist" alt="Playlist">
                    <div class="card-title">${pl.title}</div>
                    <div class="card-subtitle">${pl.trackCount} Tracks</div>
                </div>
            `).join('');
        }

        // Render Albums (Filter: Only from Enjoyed Artists)
        function renderAlbums() {
            const grid = document.getElementById('albumsGrid');
            const enjoyedAlbums = mockApi.albums.filter(alb => mockApi.enjoy_artists.includes(alb.artist));

            if (enjoyedAlbums.length === 0) {
                grid.innerHTML = `<p style="color: var(--text-sub);">Listen to at least 2 songs from an artist to unlock their albums here!</p>`;
                return;
            }

            grid.innerHTML = enjoyedAlbums.map(alb => `
                <div class="card">
                    <img src="https://via.placeholder.com/150/282828/FFFFFF?text=${encodeURIComponent(alb.title)}" alt="Album">
                    <div class="card-title">${alb.title}</div>
                    <div class="card-subtitle">${alb.artist}</div>
                    <span class="badge">Enjoyed Artist</span>
                </div>
            `).join('');
        }

        // Render Artists (All available artists + follow toggles)
        function renderArtists() {
            const grid = document.getElementById('artistsGrid');
            const allArtists = [...new Set(mockApi.songs.map(s => s.artist))];

            grid.innerHTML = allArtists.map(artist => {
                const isFollowed = mockApi.followed_artists.includes(artist);
                return `
                    <div class="card">
                        <img src="https://via.placeholder.com/150/282828/FFFFFF?text=${encodeURIComponent(artist)}" alt="Artist" style="border-radius: 50%;">
                        <div class="card-title">${artist}</div>
                        <button class="follow-btn ${isFollowed ? 'following' : ''}" onclick="event.stopPropagation(); toggleFollow('${artist}')">
                            ${isFollowed ? 'Following' : 'Follow'}
                        </button>
                    </div>
                `;
            }).join('');
        }

        // Tab Switcher
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            event.target.classList.add('active');
            document.getElementById(`tab-${tabName}`).classList.add('active');
        }

        init();
    </script>
</body>
</html>
