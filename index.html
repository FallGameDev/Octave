<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Octave</title>
  
  <style>
    :root {
      --bg-color: #07040d;
      --accent-cyan: #38bdf8;
      --accent-purple: #c084fc;
      --accent-magenta: #e879f9;
      --bar-bg: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Centered Splash Container */
    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
    }

    /* Pulsing Logo */
    .logo-wrapper {
      width: 160px;
      height: 160px;
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 20px rgba(192, 132, 252, 0.25));
      }
      50% {
        transform: scale(1.04);
        filter: drop-shadow(0 0 35px rgba(192, 132, 252, 0.5));
      }
    }

    .logo-svg {
      width: 100%;
      height: 100%;
    }

    /* Loading Bar Area */
    .loader-container {
      width: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .progress-track {
      width: 100%;
      height: 4px;
      background: var(--bar-bg);
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple), var(--accent-magenta));
      border-radius: 8px;
      transition: width 0.15s linear;
    }

    .status-text {
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="splash-container">
    
    <!-- Octave App Logo -->
    <div class="logo-wrapper">
      <svg class="logo-svg" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="octaveBg" cx="50%" cy="40%" r="70%">
            <stop offset="0%" stop-color="#1a102f" />
            <stop offset="60%" stop-color="#0d0718" />
            <stop offset="100%" stop-color="#05020a" />
          </radialGradient>
          <linearGradient id="octaveNeon" x1="20%" y1="20%" x2="80%" y2="80%">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="50%" stop-color="#c084fc" />
            <stop offset="100%" stop-color="#e879f9" />
          </linearGradient>
          <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="12" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>

        <!-- Obsidian Base Squircle -->
        <rect x="16" y="16" width="480" height="480" rx="115" fill="url(#octaveBg)" stroke="#c084fc" stroke-opacity="0.25" stroke-width="3" />

        <!-- Radial Equalizer Symbol -->
        <g filter="url(#glowEffect)" stroke="url(#octaveNeon)" stroke-width="14" stroke-linecap="round">
          <line x1="256" y1="181" x2="256" y2="116" />
          <line x1="318" y1="197" x2="380" y2="161" />
          <line x1="358" y1="237" x2="411" y2="252" />
          <line x1="358" y1="275" x2="437" y2="323" />
          <line x1="318" y1="315" x2="368" y2="401" />
          <line x1="256" y1="331" x2="256" y2="431" />
          <line x1="194" y1="315" x2="148" y2="395" />
          <line x1="154" y1="275" x2="79" y2="320" />
          <line x1="154" y1="237" x2="104" y2="223" />
          <line x1="194" y1="197" x2="135" y2="138" />
          <line x1="222" y1="186" x2="208" y2="138" />
          <line x1="290" y1="186" x2="313" y2="116" />
        </g>

        <!-- Center Pulse -->
        <circle cx="256" cy="256" r="16" fill="#ffffff" filter="url(#glowEffect)" />
      </svg>
    </div>

    <!-- Progress / Loading Bar -->
    <div class="loader-container">
      <div class="progress-track">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="status-text" id="statusText">Loading...</div>
    </div>

  </div>

  <script>
    // Simulated Progress Tracker
    const progressBar = document.getElementById('progressBar');
    const statusText = document.getElementById('statusText');
    
    let progress = 0;
    
    const interval = setInterval(() => {
      // Increments with slight random variance for a natural feel
      progress += Math.floor(Math.random() * 8) + 2;
      
      if (progress >= 100) {
        progress = 100;
        progressBar.style.width = '100%';
        statusText.textContent = 'Ready';
        clearInterval(interval);
        
        // Redirect or show main content here when finished loading:
        // setTimeout(() => { window.location.href = "app.html"; }, 300);
      } else {
        progressBar.style.width = progress + '%';
      }
    }, 120);
  </script>

</body>
</html>
